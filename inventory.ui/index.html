<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Product Inventory</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="container">
      <h1>Inventory</h1>
      <nav class="nav-right">
        <span id="userDisplay" class="hidden"></span>
        <button id="btnLogout" class="secondary hidden">Logout</button>
      </nav>
    </div>
  </header>

  <main class="container">
    <section id="loginSection">
      <h2>Sign in</h2>
      <form id="loginForm">
        <label>Username
          <input type="text" id="username" required>
        </label>
        <label>Password
          <input type="password" id="password" required>
        </label>
        <button type="submit">Login</button>
      </form>
      <div id="loginMessage" class="muted"></div>
    </section>

    <section id="appSection" class="hidden">
      <div class="toolbar">
        <h2>Stock</h2>
        <div>
          <button id="btnRefresh">Refresh</button>
          <button id="btnNew" class="primary">New Item</button>
        </div>
      </div>

      <div id="stockList" class="table-wrap">
        <table id="stockTable">
          <thead>
            <tr>
              <th>SKU</th>
              <th>Item Name</th>
              <th>Category</th>
              <th>Qty</th>
              <th>Price</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <div id="newItemModal" class="modal hidden">
        <div class="modal-content">
          <h3>New Stock Item</h3>
          <form id="newItemForm">
            <table>
              <tr>
                <td><label for="ni_sku">SKU:</label></td>
                <td><input id="ni_sku" required></td>
              </tr>
              <tr>
                <td><label for="ni_name">Item Name:</label></td>
                <td><input id="ni_name" required></td>
              </tr>
              <tr>
                <td><label for="ni_cat">Category:</label></td>
                <td><input id="ni_cat"></td>
              </tr>
              <tr>
                <td><label for="ni_price">Unit Price:</label></td>
                <td><input id="ni_price" type="number" step="0.01" required></td>
              </tr>
              <tr>
                <td><label for="ni_wprice">Wholesale Price:</label></td>
                <td><input id="ni_wprice" type="number" step="0.01"></td>
              </tr>
              <tr>
                <td><label for="ni_qty">Quantity:</label></td>
                <td><input id="ni_qty" type="number" required></td>
              </tr>
            </table>
            <div class="modal-actions">
              <button type="submit" class="primary">Create</button>
              <button type="button" id="btnCancel">Cancel</button>
            </div>
          </form>
        </div>
      </div>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
